services:
  - type: web
    name: aral-asar-heritage-map
    runtime: static
    buildCommand: mkdir -p dist && cp index.html styles.css app.js dist/
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
